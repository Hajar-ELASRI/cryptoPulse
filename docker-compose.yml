name: cryptopulse

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  kafka-storage-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    hostname: kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 15

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts/mongo-init.js:/scripts/mongo-init.js:ro
    command: ["mongosh", "mongodb://mongo:27017/crypto_pulse", "/scripts/mongo-init.js"]

  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:3.5.9-scala2.12-java17-python3-ubuntu}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints

  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:3.5.9-scala2.12-java17-python3-ubuntu}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g

  binance-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.binance"]

  rss-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.rss"]

  reddit-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.reddit"]
    profiles: ["reddit"]

  sentiment:
    <<: *python-service
    command: ["python", "-m", "sentiment.service"]

  ingestion-check:
    <<: *python-service
    restart: "no"
    profiles: ["verify"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
      binance-collector:
        condition: service_started
      rss-collector:
        condition: service_started
      sentiment:
        condition: service_started
    command: ["python", "-m", "scripts.verify_ingestion"]

  historical-loader:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["history"]
    env_file: .env
    volumes:
      - ./data/history:/data/history
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.historical_loader"]

volumes:
  kafka-data:
  mongo-data:
  spark-checkpoints:
