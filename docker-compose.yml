name: cryptopulse

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      API_PORT: 8081
      API_MONGO_URI: ${API_MONGO_URI:-mongodb://mongo:27017/crypto_pulse?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=5000}
      MONGO_DATABASE: ${MONGO_DATABASE:-crypto_pulse}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

  kafka-storage-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    hostname: kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 15

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts/mongo-init.js:/scripts/mongo-init.js:ro
    command: ["mongosh", "mongodb://mongo:27017/crypto_pulse", "/scripts/mongo-init.js"]

  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:3.5.9-scala2.12-java17-python3-ubuntu}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints

  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:3.5.9-scala2.12-java17-python3-ubuntu}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # One core and 512 MB per streaming job: trades, indicators and editorial run together.
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: 2g

  spark-trades:
    build:
      context: ./spark
    image: cryptopulse-spark:dev
    profiles: ["spark"]
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/tmp/ivy
    command:
      - /opt/spark/bin/spark-submit
      - --master=spark://spark-master:7077
      - --packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf=spark.jars.ivy=/tmp/ivy
      - --conf=spark.driver.host=spark-trades
      - --conf=spark.executor.memory=512m
      - --conf=spark.cores.max=1
      - --conf=spark.sql.shuffle.partitions=4
      - /opt/cryptopulse/cryptopulse_spark/jobs/trades_stream.py

  spark-indicators:
    image: cryptopulse-spark:dev
    profiles: ["spark"]
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/tmp/ivy
    command:
      - /opt/spark/bin/spark-submit
      - --master=spark://spark-master:7077
      - --packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf=spark.jars.ivy=/tmp/ivy
      - --conf=spark.driver.host=spark-indicators
      - --conf=spark.executor.memory=512m
      - --conf=spark.cores.max=1
      - --conf=spark.sql.shuffle.partitions=4
      - /opt/cryptopulse/cryptopulse_spark/jobs/indicators_stream.py

  spark-editorial:
    image: cryptopulse-spark:dev
    profiles: ["spark"]
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints
      - spark-ivy:/tmp/ivy
    command:
      - /opt/spark/bin/spark-submit
      - --master=spark://spark-master:7077
      - --packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf=spark.jars.ivy=/tmp/ivy
      - --conf=spark.driver.host=spark-editorial
      - --conf=spark.executor.memory=512m
      - --conf=spark.cores.max=1
      - --conf=spark.sql.shuffle.partitions=4
      - /opt/cryptopulse/cryptopulse_spark/jobs/editorial_stream.py

  spark-test:
    build:
      context: ./spark
    image: cryptopulse-spark:dev
    profiles: ["test"]
    restart: "no"
    volumes:
      - ./tests:/opt/cryptopulse/tests:ro
    environment:
      MONGO_TEST_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    command: ["python3", "-m", "unittest", "discover", "-s", "tests/spark", "-t", ".", "-v"]

  binance-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.binance"]

  rss-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.rss"]

  reddit-collector:
    <<: *python-service
    command: ["python", "-m", "collectors.reddit"]
    profiles: ["reddit"]

  sentiment:
    <<: *python-service
    command: ["python", "-m", "sentiment.service"]

  ingestion-check:
    <<: *python-service
    restart: "no"
    profiles: ["verify"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
      binance-collector:
        condition: service_started
      rss-collector:
        condition: service_started
      sentiment:
        condition: service_started
    command: ["python", "-m", "scripts.verify_ingestion"]

  historical-loader:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["history"]
    restart: "on-failure:3"
    env_file: .env
    volumes:
      - ./data/history:/data/history
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.historical_loader"]

volumes:
  kafka-data:
  mongo-data:
  spark-checkpoints:
  spark-ivy:
